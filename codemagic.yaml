# Codemagic CI/CD Configuration for LastWave Flutter
# Free tier: 500 build minutes/month, M1 Mac Mini instances
# Alternative to GitHub Actions macos-latest for iOS builds
# Trigger: Connect repo at codemagic.io, add this file, configure environment variables

workflows:
  # ─────────────────────────────────────────────────────────────────
  # iOS Release Build + TestFlight Deploy
  # ─────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - 'v*'
    scripts:
      - name: Set Flutter version
        script: |
          flutter --version
      - name: Get dependencies
        script: |
          cd lastwave_flutter
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd lastwave_flutter/ios
          pod install --repo-update
      - name: Configure code signing
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8
      - name: Build iOS IPA
        script: |
          cd lastwave_flutter
          flutter build ipa --release \
            --export-options-plist=ExportOptions.plist \
            --obfuscate --split-debug-info=build/ios/symbols
    artifacts:
      - lastwave_flutter/build/ios/ipa/*.ipa
      - lastwave_flutter/build/ios/symbols/**/*
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        api_key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        testers_groups:
          - "LastWave Beta"

  # ─────────────────────────────────────────────────────────────────
  # Android Release Build + Play Console Deploy
  # ─────────────────────────────────────────────────────────────────
  android-release:
    name: Android Release
    max_build_duration: 45
    instance_type: linux_arm_64
    environment:
      flutter: stable
    triggering:
      events:
        - tag
      tag_patterns:
        - 'v*'
    scripts:
      - name: Get dependencies
        script: |
          cd lastwave_flutter
          flutter pub get
      - name: Configure signing
        script: |
          echo "$KEYSTORE_BASE64" | base64 -d > lastwave_flutter/android/app/release.keystore
          cat > lastwave_flutter/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF
      - name: Build Android App Bundle (AAB)
        script: |
          cd lastwave_flutter
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols
      - name: Build APKs (split per ABI)
        script: |
          cd lastwave_flutter
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/app/outputs/symbols
    artifacts:
      - lastwave_flutter/build/app/outputs/bundle/release/*.aab
      - lastwave_flutter/build/app/outputs/flutter-apk/*.apk
      - lastwave_flutter/build/app/outputs/symbols/**/*
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: true

  # ─────────────────────────────────────────────────────────────────
  # PR Checks (Analyze + Test) - Runs on every PR
  # ─────────────────────────────────────────────────────────────────
  pr-checks:
    name: PR Checks
    max_build_duration: 30
    instance_type: linux_arm_64
    environment:
      flutter: stable
    triggering:
      events:
        - pull_request
    scripts:
      - name: Get dependencies
        script: |
          cd lastwave_flutter
          flutter pub get
      - name: Analyze
        script: |
          cd lastwave_flutter
          dart analyze --fatal-infos
      - name: Check format
        script: |
          cd lastwave_flutter
          dart format --output=none --set-exit-if-changed .
      - name: Run tests
        script: |
          cd lastwave_flutter
          flutter test --coverage
    artifacts:
      - lastwave_flutter/coverage/**/*

  # ─────────────────────────────────────────────────────────────────
  # Main Branch Build (No Deploy) - Runs on push to main/develop
  # ─────────────────────────────────────────────────────────────────
  main-build:
    name: Main Branch Build
    max_build_duration: 45
    instance_type: linux_arm_64
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - main
        - develop
    scripts:
      - name: Get dependencies
        script: |
          cd lastwave_flutter
          flutter pub get
      - name: Analyze & Test
        script: |
          cd lastwave_flutter
          dart analyze --fatal-infos
          flutter test --coverage
      - name: Build Android (debug)
        script: |
          cd lastwave_flutter
          flutter build apk --debug
      - name: Build iOS (debug, no codesign)
        script: |
          cd lastwave_flutter
          flutter build ios --debug --no-codesign
    artifacts:
      - lastwave_flutter/build/app/outputs/flutter-apk/*.apk

# Required Environment Variables (Set in Codemagic UI → App Settings)
# iOS:
#   APP_STORE_CONNECT_API_KEY       - Base64 encoded .p8 private key
#   APP_STORE_CONNECT_API_KEY_ID    - Key ID from App Store Connect
#   APP_STORE_CONNECT_ISSUER_ID     - Issuer ID from App Store Connect
# Android:
#   KEYSTORE_BASE64                 - Base64 encoded release.keystore
#   KEYSTORE_PASSWORD               - Keystore password
#   KEY_ALIAS                       - Key alias
#   KEY_PASSWORD                    - Key password
# Google Play:
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON - Service account JSON

# ExportOptions.plist (Required for iOS IPA export)
# Place at: lastwave_flutter/ExportOptions.plist
# <?xml version="1.0" encoding="UTF-8"?>
# <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
# <plist version="1.0">
# <dict>
#   <key>method</key><string>app-store</string>
#   <key>teamID</key><string>YOUR_TEAM_ID</string>
#   <key>uploadBitcode</key><false/>
#   <key>uploadSymbols</key><true/>
#   <key>compileBitcode</key><false/>
#   <key>signingStyle</key><string>automatic</string>
#   <key>stripSwiftSymbols</key><true/>
# </dict>
# </plist>