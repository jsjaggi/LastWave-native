name: lastwave_flutter
description: LastWave - Next-Gen YouTube Music Client for Android & iOS
version: 4.3.1+26
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core & Architecture
  get_it: ^9.3.0
  injectable: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^3.0.0
  dartz: ^0.10.1

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

  # Routing
  go_router: ^18.1.1

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  connectivity_plus: ^7.3.2

  # Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.4

  # Audio & Playback
  just_audio: ^0.10.6
  audio_service: ^0.18.14
  audio_session: ^0.2.4

  # Background Tasks
  workmanager: ^0.10.10
  flutter_background_service: ^5.0.5

  # UI & Animations
  flutter_animate: ^4.5.2
  dynamic_color: ^2.1.0
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.5
  shimmer: ^4.0.0
  lottie: ^3.1.2

  # Utilities
  intl: ^0.20.3
  collection: ^1.18.0
  rxdart: ^0.28.0
  uuid: ^4.5.1
  crypto: ^3.0.5
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
  flutter_downloader: ^1.11.3
  local_auth: ^3.0.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

  # Platform Integration
  flutter_local_notifications: ^22.3.2
  android_alarm_manager_plus: ^5.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.1
  json_serializable: ^6.9.0
  injectable_generator: ^3.1.3
  retrofit_generator: ^9.1.2
  drift_dev: ^2.18.0
  test: ^1.25.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700

  module:
    androidX: true
    androidPackage: com.lastwave.app
    iosBundleIdentifier: com.lastwave.app
