# This file configures the analyzer for the lastwave_core package.
# It uses very_good_analysis for strict linting.
include: package:very_good_analysis/analysis_options.4.0.0.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**

linter:
  rules:
    # Disable unused_field for generated freezed code
    unused_field: false